# 프리픽스 키 변경
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# 256 색상 지원
set -g default-terminal "screen-256color"

# 마우스 지원
set -g mouse on

# 시작 인덱스를 1로
set -g base-index 1

# Vim 스타일 키바인딩
setw -g mode-keys vi

# pane 전환 키바인딩
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 설정 리로드
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# yazi 사용한 이미지 렌더링을 위한 설정
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM


# 세션 자동 저장/복원 (tmux-resurrect + tmux-continuum)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-dir '~/.tmux/resurrect'

# 세션 생성 추적 + 안전망 정리 (prune 은 dry-run; 실제 삭제는 --apply 로 바꿀 것)
# session-created 는 비동기 알림이라 훅 안의 #{client_pid} 는 생성자가 아님 → 스크립트가 직접 찾는다
set-hook -g 'session-created[10]' 'run-shell "~/.tmux/log-created.sh #{q:hook_session_name} #{pid} #{q:hook_client}"'
set-hook -g 'session-created[11]' 'run-shell -b "~/.tmux/prune.sh"'

# TPM 초기화 (항상 파일 맨 아래에 둘 것)
run '~/.tmux/plugins/tpm/tpm'
